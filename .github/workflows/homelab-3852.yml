name: Homelab 3.8.52 image

on:
  push:
    branches: [zack/zac-193-omniroute-3.8.52]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-3852-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'razakiau/OmniRoute'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3
      - run: node scripts/test/homelab-gate.mjs
      - run: npm run typecheck:core

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ghcr.io/razakiau/omniroute:3.8.52-homelab-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/razakiau/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.8.52-homelab
          cache-from: type=gha,scope=homelab-3852
          cache-to: type=gha,mode=max,scope=homelab-3852
